name: pipelines-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "pipelines/**"
      - "scraper/**"
      - ".github/workflows/pipelines-ci.yml"
  pull_request:
    paths:
      - "pipelines/**"
      - "scraper/**"
      - ".github/workflows/pipelines-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ./scraper "./pipelines[dev]"
      - run: ruff check pipelines
      - run: pytest pipelines
